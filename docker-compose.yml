services:
  postgres:
    image: postgres:16-alpine
    container_name: trama-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trama
      POSTGRES_PASSWORD: trama
      POSTGRES_DB: trama_db
    ports:
      - '5432:5432'
    volumes:
      - trama-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trama -d trama_db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  trama-postgres-data: